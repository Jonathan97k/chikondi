name: TOKHA build verification

on:
  push:
    branches: [security/google-authenticator-mfa]
  pull_request:
    branches: [codex/chikondi-editorial-refresh]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
